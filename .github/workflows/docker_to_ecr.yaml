name: Create and Push Images to ECR

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - services/**
permissions:
  contents: read
  security-events: write
  pull-requests: write   
  id-token: write  

env: 
  AWS_REGION : "eu-west-2"
  ECR_REPOSITORY: ecs-project

jobs:
  DockerImageBuildAndPush:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service:
          - api-gateway
          - dashboard-api
          - inventory-service
          - notification-service
          - order-service
          - payment-service
          - scheduler
          - shipping-service
          - worker
    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
          role-to-assume: ${{ secrets.GitHubActionsRole }}
          role-session-name: GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}
      
    - name: Ensure ECR repository exists
      run: |
        aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }}/${{ matrix.service }} \
        || aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }}/${{ matrix.service }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Building docker image
      run: docker build -t ${{matrix.service}} ./services/${{matrix.service}}

    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
          image-ref: '${{matrix.service}}'
          format: 'sarif'
          exit-code: 0
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results-${{ matrix.service }}.sarif'
 
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
            sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

    - name: Tagging image to ECR repository
      run: |
        docker tag ${{matrix.service}} ${{ secrets.ECR_REPOSITORY }}/${{matrix.service}}:${{ github.sha }}
        docker tag ${{matrix.service}} ${{ secrets.ECR_REPOSITORY }}/${{matrix.service}}:latest

    - name: Pushing docker image
      run: |
        docker push ${{ secrets.ECR_REPOSITORY }}/${{matrix.service}}:${{ github.sha }}
        docker push ${{ secrets.ECR_REPOSITORY }}/${{matrix.service}}:latest